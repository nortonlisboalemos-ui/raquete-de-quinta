<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4A3D">
<title>Raquete de Quinta · Panelinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#23614F;--sand:#CFE6DA;--g-top:#1B4A3D;--g-mid:#2A6B59;--g-hero:#33806B;--g-tab:#3F8F78;--g-soft:#E3F0E9;--coral:#E76F51;--off:#F2F8F4;--bg:#F1F6F3;--line:#D9E6DF;--ink:#1B1F23;--muted:#5B6168;--teal:#0B6E6D;--green:#2F6B45;--rust:#9A3412}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--g-top) 0%,var(--g-mid) 100%);color:var(--off);padding:10px 14px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:20px;flex:1;line-height:1.1}
.brand small{display:block;font-family:Inter;font-weight:600;font-size:11px;letter-spacing:.8px;color:var(--sand)}
.me{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--off);font-size:13px;font-weight:700;cursor:pointer}
.turmas{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px}
.tpill{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--off);font-weight:700;font-size:14px;cursor:pointer}
.tpill.on{background:var(--sand);color:var(--g-top);border-color:var(--sand)}
.demo{background:#FBE7DC;color:var(--rust);font-size:12px;font-weight:600;padding:8px 14px;text-align:center}
main{flex:1;padding:14px 14px 96px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.dark{background:var(--navy);color:var(--off);border:0}
.kick{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#2E7562}
.dark .kick{color:var(--sand)}
h2{margin:2px 0 0;font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:22px;line-height:1.1}
h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.dark .muted{color:#CFD3DC}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sand{background:var(--sand);color:var(--navy)}
.btn.white{background:#fff;color:var(--navy)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn.small{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{background:#fff;border:1px solid #E7B9A8;color:var(--rust)}
.btn:disabled{background:#E4DCCD;color:var(--muted);cursor:default}
.seg{display:flex;gap:3px;background:#E3EEE8;border-radius:12px;padding:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid #C6D9CF;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lead{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.07);font-size:14px}
.lead.first{background:rgba(233,196,106,.22)}
.bar{height:8px;border-radius:4px;background:#E3EEE8;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--coral)}
.person{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-bottom:1px solid #E3EEE8}
.person:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:17px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:var(--navy)}
.pname{flex:1;min-width:0;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F1F6F3;color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:#E5F4E4;color:var(--green);border-color:#B9DDB6}
.tag.no{background:#FBE7DC;color:var(--rust);border-color:#F0C3B0}
.yn{display:flex;gap:4px}
.yn button{min-height:38px;min-width:58px;padding:0 10px;border-radius:10px;border:1px solid #C6D9CF;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.yn button.yes{background:var(--green);border-color:var(--green);color:#fff}
.yn button.nob{background:var(--rust);border-color:var(--rust);color:#fff}
input.f,select.f,textarea.f{width:100%;min-height:46px;border-radius:12px;border:1px solid #C6D9CF;background:#fff;padding:0 12px;font-size:16px}
textarea.f{padding:10px 12px;min-height:80px;resize:vertical}
label.l{font-size:13px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid #E3EEE8;white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid #E3EEE8;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child,.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl tr.top1 td{background:#FBF0D4}
.tbl tr.meRow td{background:#EEF2F8}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod b{font-size:14px}
.pod div{width:100%;border-radius:14px 14px 6px 6px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pod span.n{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:24px;font-weight:800}
.game{display:flex;flex-direction:column;gap:4px;font-size:14px}
.game .ln{display:flex;justify-content:space-between}
.game .w{font-weight:800;color:var(--navy)}
.game .lose{color:var(--muted)}
.scorebtns{display:flex;gap:4px;flex-wrap:wrap}
.scorebtns button{width:42px;height:42px;border-radius:10px;border:1px solid #C6D9CF;background:#fff;font-weight:800;font-size:16px;cursor:pointer}
.scorebtns button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{flex:1;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.nav button{position:relative}
.nav .ico{display:flex;align-items:center;justify-content:center;width:56px;height:32px;border-radius:16px;transition:background .15s}
.nav button.on{color:var(--navy);font-weight:800}
.nav button.on .ico{background:var(--g-soft)}
.nav button.on::before{content:"";position:absolute;top:-7px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--navy)}
.nav svg{width:22px;height:22px}
.post{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid #E3EEE8}
.post:last-child{border-bottom:0}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,33,61,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:30;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw}
.sep{border:0;border-top:1px solid #E3EEE8;margin:4px 0}
.drawg{border:1px solid #D9E6DF;border-radius:12px;padding:10px 12px;background:#fff}
.drawg.ok{background:#F2F7F3;border-color:#CFE3D5}
.drawg.next{border-color:#3F8F78;box-shadow:0 0 0 2px rgba(63,143,120,.15)}
.feed{padding:0;overflow:hidden}
.feed .ph{display:block;width:100%;max-height:560px;object-fit:cover;background:#E3EEE8}
.feed video.ph{object-fit:contain;background:#000}
.fb{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px}
.ic{background:none;border:0;padding:4px;margin:-4px;color:var(--ink);cursor:pointer;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.lnk{background:none;border:0;padding:0;color:var(--muted);font-size:13px;cursor:pointer;text-align:left}
.nav button.hot svg{width:28px;height:28px;filter:drop-shadow(0 2px 4px rgba(231,111,81,.35))}
.nav button.hot.on{color:var(--navy)}
.nav button.hot.on .ico{background:var(--g-soft)}
.nav button.hot.on::before{background:var(--navy)}
/* Campeonato: padrão HBJr */
html.hbpage,html.hbpage body{background:#fff}
.hb{font-family:Manrope,Inter,system-ui,sans-serif;color:#102F28;display:flex;flex-direction:column;gap:12px}
.hb-lab{font-size:13px;font-weight:700;color:#102F28;display:block;margin-bottom:-6px}
.hb-day .hb-lab{margin-bottom:4px}
.hb-sel{width:100%;min-height:46px;border:1px solid #BCC8C2;border-radius:10px;background:#fff;padding:0 12px;font:700 16px Manrope,Inter,sans-serif;color:#102F28}
.hb-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--g-mid),var(--g-hero));color:#fff;border-radius:16px;padding:18px 16px 20px}
.hb-hero::after{content:"";position:absolute;right:-70px;top:-60px;width:220px;height:220px;border:1px solid rgba(255,255,255,.28);border-radius:50%}
.hb-kick{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.hb-hero h2{margin:8px 0 6px;font:800 22px/1.15 Manrope,Inter,sans-serif;color:#fff}
.hb-hero p{margin:0;font-size:15px;opacity:.8}
.hb-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hb-tabs button{min-height:40px;border:0;border-radius:10px;background:var(--g-soft);color:#102F28;font:600 15px Manrope,Inter,sans-serif;box-shadow:0 1px 2px rgba(16,47,40,.12);cursor:pointer}
.hb-tabs button.on{background:var(--g-tab);color:#fff}
.hb-tools .hb-sel{font-size:14px;padding:0 8px}
.hb-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.hb-upd{min-height:46px;border:0;background:transparent;font:500 15px Manrope,Inter,sans-serif;color:#102F28;cursor:pointer}
.hb-podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;align-items:end;margin-top:6px}
.hb-podium .pc{display:flex;flex-direction:column;align-items:center;gap:4px}
.hb-podium .hav{color:#102F28;width:26px;height:26px;border-radius:50%;border:1px solid #CFD8D3;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.hb-podium b{font-size:12px;font-weight:700}
.hb-podium .blk{width:100%;border-radius:14px 14px 0 0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:13px}
.hb-podium .p1 .blk{height:66px}.hb-podium .p2 .blk{height:50px}.hb-podium .p3 .blk{height:42px}
.hb-card{border:1px solid #DFE7E2;border-radius:14px;overflow:hidden;background:#fff;margin-top:-12px}
.hb-t{width:100%;border-collapse:collapse;font-size:13px}
.hb-t th{font-weight:500;color:#505F59;padding:9px 6px;text-align:center}
.hb-t td{padding:9px 6px;text-align:center;border-top:1px solid #DFE7E2;color:#3B4A44}
.hb-t .l{text-align:left}.hb-t .c{text-align:right;width:34px}
.hb-t td.pts{color:#1F7157;font-weight:800}
.hb-t tr.first td{background:#ECF4EF}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.lg{width:13px;height:13px;margin:0 0 3px}
.hb-sec{border-top:1px solid #DFE7E2;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.hb-h3{text-transform:none;letter-spacing:0;margin:0;font:800 15px/1.3 Manrope,Inter,sans-serif;color:#102F28}
.hb-h3 span{color:#505F59;font-weight:700}
.hb-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hb-d{border-collapse:collapse;font-size:13px;white-space:nowrap}
.hb-d th{font-weight:600;color:#505F59;padding:6px 7px;text-align:center;line-height:1.2}
.hb-d th.l,.hb-d td.l{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.hb-d th.g{color:#1F7157}
.hb-d td{padding:5px 7px;text-align:center;color:#3B4A44;border-bottom:1px solid #fff}
.hb-d tr.k1 td:not(.l){background:#C2D8D1}.hb-d tr.k2 td:not(.l){background:#ECF4EF}
.hb-d td b{color:#102F28}
.hb-note{margin:0;font-size:11px;color:#505F59;line-height:1.45}
.hb-chart{width:100%;height:auto;display:block}
.hb-chart .ax{font:500 11px Manrope,Inter,sans-serif;fill:#6B7873}
.hb-leg{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.hb-leg th{font-weight:500;color:#102F28;padding:6px 4px;text-align:center}
.hb-leg td{text-align:center;padding:6px 4px;border-top:1px solid #E4E9E6;color:#3B4A44}
.hb-leg td.l{text-align:left}
.hb-leg tr.tot td{font-weight:800;color:#102F28}
.hb-leg .sq{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:middle}
.hb-leg .ln{display:inline-block;width:18px;height:3px;background:#53A640;margin-right:8px;vertical-align:middle}
.hb-games{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:700px){.hb-games{grid-template-columns:1fr 1fr}}
.hb-game{border:1px solid #DFE7E2;border-radius:14px;background:#fff;padding:9px 10px 10px}
.hb-game .r{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#102F28;line-height:1.35}
.hb-game strong{color:#626F6A;font-weight:700}
.hb-game strong.w{color:#1F7157}
.hb-game .m{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.hb-game .badge{background:#E6EFEC;color:#1F7157;font-weight:800;font-size:11px;padding:2px 6px;border-radius:6px}
.hb-game .meta{font-size:11px;color:#505F59;flex:1}
.hb-del{border:0;background:none;color:#8A9690;font:600 11px Manrope,Inter,sans-serif;cursor:pointer;padding:2px 0}
.hb-del.on{color:#fff;background:#C0392B;border-radius:6px;padding:4px 8px}
.hb-foot{margin:4px 0 0;font-size:13px;color:#505F59}
.hb-old{font-size:13px;font-weight:700;color:#1F7157}
.brand h1.solo{font-size:22px;padding:4px 0}
.tpill.novo{border-style:dashed;font-size:13px}
.tlabel{padding:8px 0 0;font-size:12px;font-weight:600;color:var(--sand);letter-spacing:.3px}
.turmas.wrapx{flex-wrap:wrap;overflow:visible}
.turmas.wrapx .tpill{min-height:36px;padding:0 13px;font-size:13.5px}
</style>
</head>

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y, m-1, d); };

let sb = null;
if (ONLINE) sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

function seedTables(){
  const t = {jogadores:[],turmas:[],campeonatos:[],partidas:[],presencas:[],mural:[]};
  SEED.jogadores.forEach(n => t.jogadores.push({id:uid("j"), nome:n, ativo:true}));
  SEED.turmas.forEach(x => t.turmas.push(Object.assign({}, x)));
  SEED.campeonatos.forEach(c => {
    t.campeonatos.push({id:c.id, nome:c.nome, turma_id:c.turma_id, inicio:c.inicio, fim:c.fim, encerrado:c.encerrado, jogadores:c.jogadores.slice()});
    c.partidas.forEach(p => t.partidas.push(Object.assign({id:uid("p"), campeonato_id:c.id, created_at:p.data+"T23:00:00"}, p)));
  });
  t.mural.push({id:uid("m"), autor:"Norton", texto:"Bem-vindos à casa nova da Raquete de Quinta! Jogos, presença e o campeonato do mês agora ficam aqui.", created_at:new Date().toISOString()});
  return t;
}
const DEMO_KEY = "panelinha-demo-v1";
let demo = null;
if (!ONLINE) { try { demo = JSON.parse(store.get(DEMO_KEY)); } catch(e) {} if (!demo || !demo.turmas) demo = seedTables(); }
const saveDemo = () => store.set(DEMO_KEY, JSON.stringify(demo));

const DB = {
  async loadAll(){
    if (!ONLINE) { demo.sorteios = demo.sorteios || []; demo.comentarios = demo.comentarios || []; return JSON.parse(JSON.stringify(demo)); }
    const out = {};
    for (const t of TABLES) {
      let q = sb.from(t).select("*");
      if (t === "mural") q = q.order("created_at", {ascending:false}).limit(300);
      if (t === "presencas") { const d = new Date(); d.setDate(d.getDate()-2); q = q.gte("data", ymd(d)); }
      const { data, error } = await q;
      if (error) throw error;
      out[t] = data || [];
    }
    out.comentarios = [];
    try { const { data, error } = await sb.from("comentarios").select("*").order("created_at", {ascending:true}).limit(1000); if (error) throw error; out.comentarios = data || []; S.noSocial = false; }
    catch(e){ S.noSocial = true; }
    out.sorteios = [];
    try { const d = new Date(); d.setDate(d.getDate()-8); const { data, error } = await sb.from("sorteios").select("*").gte("data", ymd(d)); if (error) throw error; out.sorteios = data || []; S.noSorteios = false; }
    catch(e){ S.noSorteios = true; }
    return out;
  },
  async insert(t, row){
    if (!ONLINE) { const r = Object.assign({id:uid(t[0]), created_at:new Date().toISOString()}, row); (demo[t] = demo[t] || []).push(r); saveDemo(); return r; }
    const { data, error } = await sb.from(t).insert(row).select().single(); if (error) throw error; return data;
  },
  async update(t, id, patch){
    if (!ONLINE) { const r = demo[t].find(x => x.id === id); if (r) Object.assign(r, patch); saveDemo(); return r; }
    const { error } = await sb.from(t).update(patch).eq("id", id); if (error) throw error;
  },
  async remove(t, id){
    if (!ONLINE) { demo[t] = demo[t].filter(x => x.id !== id); saveDemo(); return; }
    const { error } = await sb.from(t).delete().eq("id", id); if (error) throw error;
  }
};

function toast(msg){ S.toast = msg; clearTimeout(S.toastT); S.toastT = setTimeout(() => { S.toast = ""; render(); }, 2600); render(); }
async function refresh(){
  try { S.data = await DB.loadAll(); S.err = ""; S.loadedAt = Date.now(); }
  catch(e){ S.err = "Não consegui falar com o servidor. Confira a internet e tente de novo."; console.error(e); }

}

/* ---------- regras ---------- */
const turmaAtual = () => S.data.turmas.find(t => t.id === S.turma) || S.data.turmas[0];
function nextDate(t){
  const now = new Date(); const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let delta = (t.dia_semana - d.getDay() + 7) % 7;
  if (delta === 0) { const [h,m] = String(t.hora_fim||"23:59").split(":").map(Number); if (now.getHours()*60+now.getMinutes() > h*60+m+60) delta = 7; }
  d.setDate(d.getDate()+delta); return ymd(d);
}
function champsOf(tid){ return S.data.campeonatos.filter(c => !tid || c.turma_id === tid).sort((a,b) => String(b.inicio||"").localeCompare(String(a.inicio||"")) || String(b.created_at||"").localeCompare(String(a.created_at||""))); }
function currentChamp(tid){ const l = champsOf(tid); return l.find(c => !c.encerrado) || l[0] || null; }
function gamesOf(cid){ return S.data.partidas.filter(p => p.campeonato_id === cid).sort((a,b) => (a.numero||0)-(b.numero||0)); }
function ranking(c, day){
  const roster = c.jogadores || [];
  const st = {}; roster.forEach(n => st[n] = {nome:n, pts:0, v:0, d:0, j:0, pneu:0, gp:0, gc:0, max:0});
  gamesOf(c.id).filter(g => day === "mes" || String(g.data).slice(0,10) === day).forEach(g => {
    const mx = Math.max(g.placar_a, g.placar_b) + 1;
    [[g.a1,g.placar_a,g.placar_b],[g.a2,g.placar_a,g.placar_b],[g.b1,g.placar_b,g.placar_a],[g.b2,g.placar_b,g.placar_a]].forEach(([n,mine,oth]) => {
      const s = st[n]; if (!s) return;
      s.pts += mine; s.gp += mine; s.gc += oth; s.j++; s.max += mx;
      if (mine > oth) s.v++; else { s.d++; if (mine === 0) s.pneu++; }
    });
  });
  const list = Object.values(st).map(s => { s.total = s.pts + s.v; s.saldo = s.gp - s.gc; s.aprov = s.max ? s.total / s.max : null; return s; });
  list.sort((x,y) => (y.total-x.total) || (y.v-x.v) || (y.saldo-x.saldo) || x.nome.localeCompare(y.nome));
  return list;
}
function presOf(t, date){ return S.data.presencas.filter(p => p.turma_id === t.id && String(p.data).slice(0,10) === date).sort((a,b) => String(a.created_at).localeCompare(String(b.created_at))); }
function lineup(t, date){
  const pres = presOf(t, date);

  const all = goingMembers.map(n => ({nome:n, tipo:"membro"})).concat(subs.map(s => ({nome:s.nome, tipo:s.tipo, id:s.id})));
  return { pres, inGame: all.slice(0, t.vagas), queue: all.slice(t.vagas), notGoing: t.membros.filter(n => (pres.find(p => p.nome === n) || {}).status === "nao_vou"), pending: t.membros.filter(n => !pres.find(p => p.nome === n)) };
}
async function setPresence(t, date, nome, status, tipo){

/* SORTEIO_START */
function roundSize(n){
  if (n < 4) return 0;
  const g = (a,b) => b ? g(b, a%b) : a;
  const step = n / g(n, 4);               // jogos para todos terem o mesmo número
  const pairs = n*(n-1)/2;
  let G = step;
  if (n <= 6) { while (2*G < pairs) G += step; } else { while (G < n) G += step; }
  return G;
}
function defaultRounds(n, t){
  const R = roundSize(n); if (!R) return 0;
  const [h1,m1] = String(t.hora_inicio||"20:00").split(":").map(Number), [h2,m2] = String(t.hora_fim||"22:00").split(":").map(Number);
  const hrs = Math.max(0.5, ((h2*60+m2)-(h1*60+m1))/60);
  const B = {4:3, 5:5, 6:4.5}[n] || 4.5;
  return Math.max(1, Math.round(hrs*B/R));
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const pk = (x,y) => x < y ? x+"|"+y : y+"|"+x;
function drawRoundOnce(P, G){
  const n = P.length, played = {}, last = {}, pc = {}, games = [];
  P.forEach(p => { played[p] = 0; last[p] = -1; });
  const order = shuffle(P);
  for (let gi = 0; gi < G; gi++) {
    const cand = shuffle(order).sort((a,b) => (played[a]-played[b]) || ((last[b]===gi-1?0:1) - (last[a]===gi-1?0:1)));
    // quem tem menos jogos entra; empate: prioriza quem descansou no jogo anterior
    const minP = played[cand[3]];
    const must = cand.filter(p => played[p] < minP), pool = shuffle(cand.filter(p => played[p] === minP));
    const four = must.concat(pool.slice(0, 4 - must.length));
    const [a,b,c,d] = four;
    const splits = shuffle([[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]]);
    splits.sort((x,y) => ((pc[pk(...x[0])]||0)+(pc[pk(...x[1])]||0)) - ((pc[pk(...y[0])]||0)+(pc[pk(...y[1])]||0)));
    const [A,B] = splits[0];
    games.push({a:A, b:B});
    [A,B].forEach(du => { pc[pk(...du)] = (pc[pk(...du)]||0) + 1; });
    four.forEach(p => { played[p]++; last[p] = gi; });
  }
  return games;
}
function scoreDraw(P, games){
  const n = P.length, total = n*(n-1)/2;
  let pen = 0; const pc = {}, seen = new Set(), match = {};
  let firstRepeat = -1, coveredAt = -1, prevMk = "";
  games.forEach((g, i) => {
    [g.a, g.b].forEach(du => { const k = pk(...du); pc[k] = (pc[k]||0)+1; if (pc[k] === 2 && firstRepeat < 0) firstRepeat = i; seen.add(k); });
    if (seen.size === total && coveredAt < 0) coveredAt = i;
    const mk = [pk(...g.a), pk(...g.b)].sort().join(" x "); match[mk] = (match[mk]||0)+1; if (match[mk] > 1) pen += 40; if (i && mk === prevMk) pen += 25; prevMk = mk;
  });
  const cap = Math.ceil(2*games.length/total);
  Object.values(pc).forEach(v => { if (v > cap) pen += 60*(v-cap); });
  if (firstRepeat >= 0 && (coveredAt < 0 || firstRepeat < coveredAt) && games.length*2 >= total) pen += 30;
  P.forEach(p => {
    let rest = 0, streak = 0;
    games.forEach(g => { const inG = g.a.includes(p) || g.b.includes(p);
      if (inG) { streak++; if (streak > 3) pen += 2; rest = 0; } else { rest++; if (rest > 1) pen += 6; streak = 0; } });
  });
  return pen;
}
function sortear(players, rounds){
  const P = players.slice(), n = P.length, R = roundSize(n); if (!R) return [];
  let all = [];
  for (let r = 0; r < rounds; r++) {
    let best = null, bestS = Infinity;
    for (let i = 0; i < 1500 && bestS > 0; i++) { const g = drawRoundOnce(P, R); const s = scoreDraw(P, all.concat(g)); if (s < bestS) { bestS = s; best = g; } }
    all = all.concat(best);
  }
  return all;
}

const LOCAL_SORT = "panelinha-sorteio-";
function sorteioOf(t, date){
  // só vale o sorteio feito no próprio dia do jogo; sorteio feito antes (teste, engano) é ignorado
  const valido = x => x && x.created_at && ymd(new Date(x.created_at)) >= date;
  const r = (S.data.sorteios||[]).find(x => x.turma_id === t.id && String(x.data).slice(0,10) === date);
  if (r) return valido(r) ? r : null;
  try { const l = JSON.parse(store.get(LOCAL_SORT+t.id+"-"+date)); if (l && l.jogos && valido(l)) return Object.assign({local:true}, l); } catch(e){}
  return null;
}
function drawStatus(t, date, jogos){
  // liga cada jogo sorteado ao placar já lançado (mesmas duplas, mesma data)
  const used = new Set();
  const day = S.data.partidas.filter(p => String(p.data).slice(0,10) === date);
  const same = (x, y) => x.length === 2 && y.includes(x[0]) && y.includes(x[1]);
  return jogos.map(j => {
    const g = day.find(p => !used.has(p.id) && ((same(j.a,[p.a1,p.a2]) && same(j.b,[p.b1,p.b2])) || (same(j.a,[p.b1,p.b2]) && same(j.b,[p.a1,p.a2]))));
    if (g) used.add(g.id);
    return g || null;
  });
}
function drawCandidates(t, date, L){
  const extra = L.pres.filter(p => p.tipo !== "membro" && p.status === "vou").map(p => p.nome);
  return [...new Set([...t.membros, ...extra])];
}
function drawSelection(t, date, L){
  const key = t.id+"|"+date;
  if (!S.f.drawPick || S.f.drawKey !== key) {
    const conf = L.inGame.map(x => x.nome);
    S.f.drawPick = conf.length >= 4 ? conf : t.membros.filter(n => !L.notGoing.includes(n));
    S.f.drawKey = key; S.f.drawRounds = null;
  }
  return S.f.drawPick;
}
async function saveSorteio(t, date, jogos){
  const row = {turma_id:t.id, data:date, jogos, criado_por:S.me||null};
  const cur = (S.data.sorteios||[]).find(x => x.turma_id === t.id && String(x.data).slice(0,10) === date);
  if (!S.noSorteios) {
    try {
      if (cur) await DB.update("sorteios", cur.id, {jogos, criado_por:S.me||null, created_at:new Date().toISOString()});
      else await DB.insert("sorteios", row);

    } catch(e){ console.error(e); S.noSorteios = true; }

  return false;
}

function compressImage(file, max = 1440, q = 0.82){
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? ok({blob:b, w, h}) : fail(new Error("não consegui ler a foto")), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("formato de foto não suportado")); };
    img.src = url;
  });
}
const VIDEO_MAX_MB = 50;
const isVideoUrl = u => /\.(mp4|mov|webm|m4v)(\?|#|$)/i.test(String(u||"")) || /^data:video\//.test(String(u||""));
function videoExt(type){ return /quicktime/.test(type) ? "mov" : /webm/.test(type) ? "webm" : "mp4"; }
async function uploadPhoto(blob, type){
  type = type || "image/jpeg";
  if (!ONLINE) return await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
  const ext = type.startsWith("video/") ? videoExt(type) : "jpg";
  const path = new Date().toISOString().slice(0,7) + "/" + uid(ext === "jpg" ? "f" : "v") + "." + ext;
  const { error } = await sb.storage.from("fotos").upload(path, blob, {contentType:type, cacheControl:"31536000"});
  if (error) {
    if (/size|large|exceed/i.test(error.message||"")) throw new Error("vídeo maior que o limite do servidor");
    if (/mime|type/i.test(error.message||"")) throw new Error("o servidor ainda não aceita vídeos (falta o ajuste no banco)");
    throw error;
  }
  return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
}
async function removePhoto(url){
  if (!ONLINE || !url) return; const i = url.indexOf("/fotos/"); if (i < 0) return;
  try { await sb.storage.from("fotos").remove([decodeURIComponent(url.slice(i+7))]); } catch(e){}
}

    <div><b style="font-size:16px">Completar o jogo</b><div class="muted">${missing? (missing===1?"Falta 1 jogador.":"Faltam "+missing+" jogadores."):"Jogo completo. Bom jogo!"}</div></div>
    ${others.length? `<label class="l">Da outra turma</label>${others.map(n => { const p = L.pres.find(x => x.nome === n); return `<div class="person">${av(n)}<span class="pname">${esc(n)}</span><button class="btn ${p?'ghost':'teal'} small" data-act="callSub" data-n="${esc(n)}">${p?'Chamado ✓':'Chamar'}</button></div>`; }).join("")}`:""}
    <label class="l" for="guest">Convidado de fora do grupo</label>
    <div class="row"><input class="f" id="guest" data-bind="guest" value="${esc(S.f.guest)}" placeholder="Nome de quem vem jogar"><button class="btn small" data-act="addGuest">Adicionar</button></div>
    <span class="muted">Substitutos jogam o dia. No ranking, só pontua quem está na lista do campeonato.</span>
  </section>`;
}

function vSorteio(t, date, L){
  const sor = sorteioOf(t, date);
  const c = currentChamp(t.id);
  if (sor && !S.f.redraw) {
    const st = drawStatus(t, date, sor.jogos);
    const done = st.filter(Boolean).length;
    const P = [...new Set(sor.jogos.flatMap(j => j.a.concat(j.b)))];
    const per = P.length ? sor.jogos.length*4/P.length : 0;
    const seen = {};
    return `<section class="card col" id="sorteio">
      <div class="row" style="justify-content:space-between"><div><div class="kick">${date===today()?"Hoje":DIAS[t.dia_semana]+" "+ddmm(date)}</div><b style="font-size:16px">Jogos sorteados</b><div class="muted">${sor.jogos.length} jogos · ${per} para cada · ${done} de ${sor.jogos.length} com placar</div></div></div>
      ${sor.local? '<div class="demo" style="margin:0">Este sorteio ficou só neste celular. Para a turma toda ver, falta um ajuste no banco (avise o Norton).</div>':''}
      <div class="col" style="gap:8px">${sor.jogos.map((j,i) => {
        const g = st[i]; const rest = P.filter(p => !j.a.includes(p) && !j.b.includes(p));
        const rep = [j.a, j.b].filter(d => { const k = d.slice().sort().join("|"); seen[k] = (seen[k]||0)+1; return seen[k] > 1; }).length;
        const next = !g && st.slice(0,i).every(Boolean);
        let score = "";
        if (g) { const aIsA = j.a.includes(g.a1); const sa = aIsA? g.placar_a:g.placar_b, sb = aIsA? g.placar_b:g.placar_a; score = `<b>${sa} x ${sb}</b>`; }
        return `<div class="drawg ${g?'ok':''} ${next?'next':''}"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1"><div class="kick" style="color:${next?'#2E7562':'#6B7280'}">Jogo ${i+1}${next?' · agora':''}${rep?' · dupla repetida':''}</div>
          <div style="font-weight:700">${esc(j.a.join(" / "))} <span class="muted">x</span> ${esc(j.b.join(" / "))}</div>
          ${rest.length? `<div class="muted" style="font-size:12px">Descansa: ${rest.map(esc).join(", ")}</div>`:''}</div>
          ${g? `<div style="text-align:right">${score}<div class="muted" style="font-size:12px">lançado ✓</div></div>` : (c && S.f.scoreOpen !== i ? `<button class="btn ${next?'':'ghost'} small" data-act="dOpen" data-i="${i}">Lançar placar</button>`:'')}
        </div>
        ${!g && c && S.f.scoreOpen === i ? `<div class="col" style="gap:6px;margin-top:10px">
          <label class="l">${esc(j.a.join(" / "))}</label>${scoreBtns("spa")}
          <label class="l">${esc(j.b.join(" / "))}</label>${scoreBtns("spb")}
          <div class="grid2"><button class="btn small" data-act="dSave" data-i="${i}">Salvar placar</button><button class="btn ghost small" data-act="dClose">Cancelar</button></div>
        </div>` : ''}</div>`; }).join("")}</div>
      ${done ? '<span class="muted">Com placar lançado, o sorteio fica travado. Para corrigir um placar, exclua o jogo na aba Campeonato, em Jogos.</span>'
        : (S.confirm === "redraw" ? `<div class="col" style="gap:6px"><span class="muted">A lista atual será trocada por um novo sorteio.</span><div class="grid2"><button class="btn danger small" data-act="redrawGo">Sim, sortear de novo</button><button class="btn ghost small" data-act="ask" data-id="">Cancelar</button></div></div>` : `<button class="btn ghost small" data-act="ask" data-id="redraw">Sortear de novo</button>`)}
    </section>`;
  }
  const cand = drawCandidates(t, date, L);
  const pick = drawSelection(t, date, L).filter(n => cand.includes(n));
  S.f.drawPick = pick;
  const n = pick.length, R = roundSize(n);
  const def = defaultRounds(n, t);
  const rounds = Math.max(1, Number(S.f.drawRounds) || def || 1);
  return `<section class="card col" id="sorteio">
    <div><div class="kick">${date===today()?"Hoje":DIAS[t.dia_semana]+" "+ddmm(date)}</div><b style="font-size:16px">Sortear os jogos</b><div class="muted">Faça um pouco antes da partida. Todo mundo joga o mesmo número de jogos.</div></div>
    <label class="l">Quem joga hoje (${n})</label>
    <div class="chips" style="flex-wrap:wrap">${cand.map(nm => `<button class="chip ${pick.includes(nm)?'on':''}" data-act="drawToggle" data-n="${esc(nm)}">${pick.includes(nm)?'✓ ':''}${esc(nm)}</button>`).join("")}</div>
    ${n < 4 ? '<span class="muted">Marque pelo menos 4 jogadores.</span>' : `
    <label class="l" for="drr">Quantidade de jogos</label>
    <select class="f" id="drr" data-bind="drawRounds" data-rerender="1">${[1,2,3].map(r => `<option value="${r}" ${r===rounds?'selected':''}>${R*r} jogos · ${R*r*4/n} para cada${r===def?' (sugerido)':''}</option>`).join("")}</select>
    <button class="btn" data-act="drawGo">Sortear ${R*rounds} jogos</button>
    ${n===6? '<span class="muted">Com 6: as 15 duplas possíveis jogam uma vez e, no fim, 3 duplas se repetem para fechar 6 jogos para cada.</span>':''}`}
    ${S.f.redraw? '<button class="btn ghost small" data-act="redrawCancel">Voltar para o sorteio atual</button>':''}
  </section>`;
}

function scoreBtns(k){ let h = ""; for (let v = 0; v <= 7; v++) h += `<button class="${S.f[k]===v?'on':''}" data-act="score" data-k="${k}" data-v="${v}" aria-label="${v} games">${v}</button>`; return `<div class="scorebtns">${h}</div>`; }
function vDia(t){
  const date = nextDate(t); const L = lineup(t, date); const c = currentChamp(t.id);
  const manual = S.f.manual && c ? (S.champ = c.id, vLancar(c)) : "";
  const sorteio = date === today() ? vSorteio(t, date, L)
    : `<section class="card col"><b style="font-size:16px">Sorteio dos jogos</b><span class="muted">O sorteio abre no dia do jogo (${DIAS[t.dia_semana].toLowerCase()} ${ddmm(date)}). Até lá, marque a presença acima.</span></section>`;
  return sorteio + (c ? `<button class="btn ghost small" data-act="manual">${S.f.manual? 'Fechar jogo fora do sorteio' : '+ Lançar jogo fora do sorteio'}</button>` : '') + manual;
}

/* ---------- Campeonato no padrão do app HBJr ---------- */
const HB_COLORS = {"Hercílio":"#00AEA6","Norton":"#C26EC0","Geraldo":"#7988ED","Felipe":"#60A746","Hemerson":"#D77428","Alexandre":"#D9668E"};
const HB_EXTRA = ["#00AEA6","#C26EC0","#7988ED","#60A746","#D77428","#D9668E","#3E8ED0","#B59A2B","#8C6BB1","#4F9D8F"];
function hbColor(c, nome){ if (HB_COLORS[nome]) return HB_COLORS[nome]; const i = Math.max(0, (c.jogadores||[]).indexOf(nome)); return HB_EXTRA[(i + 6) % HB_EXTRA.length]; }
function mix(hex, k){ const n = parseInt(hex.slice(1),16); const r = n>>16&255, g = n>>8&255, b = n&255; const f = v => Math.round(v + (255-v)*k).toString(16).padStart(2,"0"); return "#"+f(r)+f(g)+f(b); }
function mixHex(a, b, t){ const A = parseInt(a.slice(1),16), B = parseInt(b.slice(1),16); const c = (s) => Math.round(((A>>s)&255)*(1-t) + ((B>>s)&255)*t); return "#"+[16,8,0].map(s => c(s).toString(16).padStart(2,"0")).join(""); }
const abbr = n => n.normalize("NFD").replace(/[̀-ͯ]/g,"").slice(0,3).toUpperCase();
const iso = d => String(d||"").slice(0,10);
const dmy = d => { const x = iso(d).split("-"); return x.length===3 ? x[2]+"/"+x[1]+"/"+x[0] : d; };
const MEDAL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 2h9.6l-3 6h-3.6z"/><path d="M9 8.5 7.2 2M15 8.5 16.8 2"/><circle cx="12" cy="15" r="6"/><path d="m12 12.2.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z"/></svg>';
function niceMax(v, steps){ if (v <= 0) return steps; const raw = v/steps; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = [1,2,2.5,4,5,8,10].find(x => x*p >= raw) || 10; return m*p*steps; }
function hbChart(c, r, dates){
  if (!dates.length || !r.length) return "";
  const per = dates.map(d => ranking(c, d));
  const val = (di, nome) => { const x = per[di].find(z => z.nome === nome); return x ? x.total : 0; };
  const maxDay = Math.max(1, ...r.flatMap(x => dates.map((_,di) => val(di, x.nome))));
  const maxTot = Math.max(1, ...r.map(x => x.total));
  const L = niceMax(maxDay, 4), R = niceMax(maxTot, 4);
  const W = 470, H = 270, x0 = 52, x1 = W-40, y0 = 14, y1 = H-36, ph = y1-y0;
  const gw = (x1-x0)/r.length, D = dates.length, bw = Math.min(16, (gw*0.72)/D), gap = Math.min(4, bw*0.25);
  let g = "";
  for (let i = 0; i <= 4; i++) { const y = y1 - ph*i/4;
    g += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="#E4E9E6"/><text x="${x0-8}" y="${y+4}" text-anchor="end" class="ax">${+(L*i/4).toFixed(1)}</text><text x="${x1+8}" y="${y+4}" class="ax">${+(R*i/4).toFixed(1)}</text>`; }
  g += `<line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y1}" stroke="#7A8882"/><line x1="${x1}" x2="${x1}" y1="${y0}" y2="${y1}" stroke="#7A8882"/><line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="#7A8882"/>`;
  g += `<text transform="translate(14 ${(y0+y1)/2}) rotate(-90)" text-anchor="middle" class="ax">Pontos conquistados</text>`;
  const pts = [];
  r.forEach((x, i) => { const cx = x0 + gw*i + gw/2; const col = hbColor(c, x.nome); const tw = D*bw + (D-1)*gap; let bx = cx - tw/2;
    dates.forEach((_, di) => { const v = val(di, x.nome); const h = ph*v/L; const k = D>1 ? 0.55*(D-1-di)/(D-1) : 0;
      g += `<rect x="${bx.toFixed(1)}" y="${(y1-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${mix(col,k)}"><title>${esc(x.nome)} · ${ddmm(dates[di])}: ${v}</title></rect>`; bx += bw + gap; });
    g += `<line x1="${cx}" x2="${cx}" y1="${y1}" y2="${y1+5}" stroke="#7A8882"/><text x="${cx}" y="${y1+20}" text-anchor="middle" class="ax">${abbr(x.nome)}</text>`;
    pts.push([cx, y1 - ph*x.total/R]); });
  g += `<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#53A640" stroke-width="3.5" stroke-linejoin="round"/>`;
  const gray = di => D>1 ? mixHex("#B0B7B4", "#505F59", di/(D-1)) : "#505F59";
  return `<section class="hb-sec"><h3 class="hb-h3">Evolução / Pontos dos jogadores por dia — ${esc(c.nome)}</h3>
    <svg viewBox="0 0 ${W} ${H}" class="hb-chart" role="img" aria-label="Pontos por dia de cada jogador e total acumulado">${g}</svg>
    <div class="hb-scroll"><table class="hb-leg"><thead><tr><th></th>${r.map(x => `<th><i class="dot lg" style="background:${hbColor(c,x.nome)}"></i><br>${esc(x.nome)}</th>`).join("")}</tr></thead><tbody>
    ${dates.map((d,di) => `<tr><td class="l"><i class="sq" style="background:${gray(di)}"></i>${ddmm(d)}</td>${r.map(x => `<td>${val(di,x.nome)}</td>`).join("")}</tr>`).join("")}
    <tr class="tot"><td class="l"><i class="ln"></i>TOTAL</td>${r.map(x => `<td>${x.total}</td>`).join("")}</tr></tbody></table></div></section>`;
}
function vRank(){
  const t = turmaAtual();
  if (!S.champ || !S.data.campeonatos.find(c => c.id === S.champ)) { const c = currentChamp(t.id); S.champ = c ? c.id : null; }
  const c = S.data.campeonatos.find(x => x.id === S.champ);

  <section class="hb-hero"><div class="hb-kick">${esc(tn)} · Guto</div><h2>${esc(c.nome)}</h2><p>${n*(n-1)/2} duplas · ${games.length} jogos${c.inicio? " · "+iso(c.inicio)+" a "+iso(c.fim||c.inicio):""}</p></section>
  <div class="hb-tabs"><button class="${tab==='ranking'?'on':''}" data-act="ctab" data-v="ranking">Ranking</button><button class="${tab==='jogos'?'on':''}" data-act="ctab" data-v="jogos">Jogos</button></div>
  <div class="hb-tools"><button class="hb-upd" data-act="reload">Atualizar consulta</button>
    <label class="hb-day"><span class="hb-lab">Dia</span><select class="hb-sel" data-act-change="pickDay"><option value="mes">${tab==='jogos'?'Todos os dias':'Campeonato inteiro'}</option>${dates.map(d => `<option value="${d}" ${S.day===d?'selected':''}>${dmy(d)}</option>`).join("")}</select></label></div>`;
  const foot = `<p class="hb-foot">Atualizado em ${new Date(S.loadedAt||Date.now()).toLocaleString("pt-BR")}.</p>
  <a class="hb-old" href="${OLD_APP}" target="_blank" rel="noopener">Abrir no app antigo (HBJr) ↗</a></div>`;
  if (tab === "jogos") {
    const list = games.filter(g => S.day === "mes" || iso(g.data) === S.day);
    return head + `<div class="hb-games">${list.map((g, gi) => { const aw = g.placar_a > g.placar_b; const sub = [g.a1,g.a2,g.b1,g.b2].filter(x => !(c.jogadores||[]).includes(x));
      return `<article class="hb-game"><div class="r"><span>${esc(g.a1)} / ${esc(g.a2)}</span><strong class="${aw?'w':''}">${g.placar_a}</strong></div><div class="r"><span>${esc(g.b1)} / ${esc(g.b2)}</span><strong class="${!aw?'w':''}">${g.placar_b}</strong></div>
      <div class="m"><span class="badge">Jogo ${S.day==="mes" ? (g.numero||"") : gi+1}</span><span class="meta">Finalizado · ${iso(g.data)}${sub.length? ' · fora do ranking: '+sub.map(esc).join(", "):""}</span>
      ${S.confirm === "g:"+g.id ? `<button class="hb-del on" data-act="delGame" data-id="${esc(g.id)}">Confirmar exclusão</button>` : `<button class="hb-del" data-act="ask" data-id="g:${esc(g.id)}">Excluir</button>`}</div></article>`; }).join("") || '<p class="hb-foot">Sem jogos neste dia.</p>'}</div>` + foot;
  }
  const r = ranking(c, S.day);
  const podium = [1,0,2].filter(i => r[i]).map(i => `<div class="pc p${i+1}"><span class="hav">${esc(r[i].nome[0])}</span><b>${esc(r[i].nome)}</b><div class="blk" style="background:${mix(hbColor(c,r[i].nome),0.22)}">${MEDAL}<span>${r[i].total} pts</span></div></div>`).join("");
  const label = i => i===0?"CAMPEÃO":(i===1?"Segundo":(i===2?"Terceiro":""));
  const pct = x => x.aprov==null ? "—" : (x.aprov*100).toFixed(2).replace(".",",")+"%";
  return head + `
  <div class="hb-podium">${podium}</div>
  <div class="hb-card"><table class="hb-t"><thead><tr><th class="c">Pos.</th><th class="l">Jogador</th><th>Pts</th><th>J</th><th>V</th><th>D</th><th>Saldo</th></tr></thead><tbody>
  ${r.map((x,i) => `<tr class="${i===0?'first':''}"><td class="c">${i+1}º</td><td class="l"><i class="dot" style="background:${hbColor(c,x.nome)}"></i>${esc(x.nome)}</td><td class="pts">${x.total}</td><td>${x.j}</td><td>${x.v}</td><td>${x.d}</td><td>${x.saldo>0?'+':''}${x.saldo}</td></tr>`).join("")}
  </tbody></table></div>
  <section class="hb-sec"><h3 class="hb-h3">Tabela detalhada — <span>Data: ${S.day==='mes'?'Todas':dmy(S.day)}</span></h3>
  <div class="hb-scroll"><table class="hb-d"><thead><tr><th class="l">Jogador</th><th>Pontos</th><th>Vitórias</th><th class="g">TOTAL</th><th>Partidas</th><th>Pneu</th><th>GP*</th><th>GC*</th><th>Saldo<br>Games</th><th>Max<br>Pontos</th><th>Aproveit.</th><th>Classificação</th><th>Class.</th></tr></thead><tbody>

  </tbody></table></div>
  <p class="hb-note">* GP: total de games prós · GC: total de games contra · TOTAL = pontos (games) + vitórias · Aproveit. = TOTAL ÷ Max Pontos · Pneu: partidas perdidas sem vencer nenhum game (ex.: 6 x 0).</p></section>
  ${hbChart(c, ranking(c, "mes"), dates)}` + foot;

function vMural(){

  const np = S.f.newPhoto;

function panelaNomes(){

  return [...new Set([...ativos, ...S.data.turmas.flatMap(x => x.membros||[])])].sort((a,b) => a.localeCompare(b, "pt-BR"));
}

  const nomes = panelaNomes(); const ts = S.data.turmas;

function dayToggle(tid, n){
  const x = S.data.turmas.find(z => z.id === tid); if (!x) return;
  const on = (x.membros||[]).includes(n);
  act(async () => { if (!on) await ensurePlayer(n); await DB.update("turmas", x.id, {membros: on ? x.membros.filter(m => m !== n) : [...(x.membros||[]), n]}); }, on ? n+" saiu da "+x.nome.toLowerCase() : n+" entrou na "+x.nome.toLowerCase());
}
function addPanela(){
  const n = (S.f.newPanela||"").trim(); if (!n) return toast("Escreva o nome.");

  S.f.newPanela = "";
  act(async () => { if (j) await DB.update("jogadores", j.id, {ativo:true}); else await DB.insert("jogadores", {nome:n, ativo:true}); }, n+" entrou na panela");

function delPanela(n){
  const j = S.data.jogadores.find(z => z.nome === n);
  act(async () => { if (j) await DB.update("jogadores", j.id, {ativo:false}); for (const x of S.data.turmas) if ((x.membros||[]).includes(n)) await DB.update("turmas", x.id, {membros: x.membros.filter(m => m !== n)}); }, n+" saiu da panela");

function render(){
  const root = document.getElementById("app");
  if (!S.data) { root.innerHTML = `<div style="padding:40px;text-align:center">${S.err? esc(S.err)+'<br><br><button class="btn" data-act="retry">Tentar de novo</button>':"Carregando…"}</div>`; return; }
  const t = turmaAtual();
  const views = {inicio:vInicio, jogo:vJogo, rank:vRank, mural:vMural, turma:vTurma};
  const scrollY = window.scrollY; const ae = document.activeElement; const focusSel = ae && ae.dataset && ae.dataset.bind ? ae.dataset.bind : null; const caret = ae && ae.selectionStart;
  root.innerHTML = `
  <header class="top"><div class="brand">${EMBLEM(38)}${S.view==="mural" ? '<h1 class="solo">Nossa Panela</h1>' : (S.view==="turma" ? '<h1 class="solo">Panela Completa</h1>' : `<h1><small>PANELINHA</small>Raquete de ${esc(t.nome)}</h1>`)}<button class="me" data-act="who">${S.me? esc(S.me):"Entrar"}</button></div>
  ${S.view==="mural" ? "" : `${S.view==="turma" ? '<div class="tlabel">Selecione a panelinha abaixo</div>' : ''}<nav class="turmas ${S.view==="turma"?"wrapx":""}" aria-label="Dias de jogo">${S.data.turmas.map(x => `<button class="tpill ${x.id===t.id && !(S.view==="turma" && S.panela)?'on':''}" data-act="turma" data-id="${esc(x.id)}">${esc(x.nome)}</button>`).join("")}<button class="tpill novo" data-act="newDay">+ Novo dia de jogo</button>${S.view==="turma" ? `<button class="tpill ${S.panela?'on':''}" data-act="panela">Toda a panela</button>` : ''}</nav>`}</header>
  ${ONLINE? "": '<div class="demo">Modo demonstração: os dados ficam só neste aparelho. Com o Supabase ligado, tudo passa a ser da turma.</div>'}
  ${S.err? `<div class="demo">${esc(S.err)}</div>`:""}
  <main>${(views[S.view]||vMural)()}</main>
  <nav class="nav"><div class="in">${[["mural","Resenha","mural"],["jogo","Jogo de hoje","jogo"],["rank","Campeonato","rank"],["turma","Toda a Panela","turma"]].map(([k,l,i]) => `<button class="${S.view===k?'on':''} ${k==='mural'?'hot':''}" data-act="view" data-v="${k}" ${S.view===k?'aria-current="page"':''}><span class="ico">${k==='mural'? ICON_RESENHA : ICON[i]}</span>${l}</button>`).join("")}</div></nav>
  ${(!S.me || S.sheet==="who")? vWho():""}
  ${S.toast? `<div class="toast" role="status">${esc(S.toast)}</div>`:""}`;
  document.documentElement.classList.toggle("hbpage", S.view === "rank");
  if (focusSel) { const el = root.querySelector(`[data-bind="${focusSel}"]`); if (el) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch(e){} } }
  window.scrollTo(0, scrollY);
}

/* ---------- ações ---------- */
function setBind(path, val){ if (path.startsWith("outro.")) S.f.outro[path.slice(6)] = val; else if (path.startsWith("cmt.")) { S.f.cmt = S.f.cmt || {}; S.f.cmt[path.slice(4)] = val; } else S.f[path] = val; }
document.addEventListener("input", e => { const b = e.target.dataset && e.target.dataset.bind; if (!b) return; setBind(b, e.target.type === "checkbox" ? e.target.checked : e.target.value); if (e.target.dataset.rerender || e.target.type === "date") render(); });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.actChange === "pickChamp") { S.champ = el.value; S.day = "mes"; render(); return; }
  if (el.dataset.actChange === "pickDay") { S.day = el.value; render(); return; }
  if (el.dataset.bind) { setBind(el.dataset.bind, el.type === "checkbox" ? el.checked : el.value); if (el.dataset.rerender) render(); }
});
// campo de foto fixo, fora da área que a tela redesenha (a atualização automática não o apaga)
const PHOTO_IN = document.createElement("input");
PHOTO_IN.type = "file"; PHOTO_IN.accept = "image/*,video/*"; PHOTO_IN.style.cssText = "position:fixed;left:-9999px;width:1px;height:1px;opacity:0";
document.body.appendChild(PHOTO_IN);
function onPhotoPicked(){
  const f = PHOTO_IN.files && PHOTO_IN.files[0];
  S.picking = false;
  if (!f) return;
  S.f.compose = true;
  if ((f.type||"").startsWith("video/") || /\.(mov|mp4|m4v|webm)$/i.test(f.name||"")) {
    const mb = f.size/1048576;
    PHOTO_IN.value = ""; S.view = "mural";
    if (mb > VIDEO_MAX_MB) { render(); return toast(`Vídeo grande demais (${mb.toFixed(0)} MB). O limite é ${VIDEO_MAX_MB} MB: corte o vídeo no celular (uns 20 a 30 segundos) e tente de novo.`); }
    if (S.f.newPhoto) URL.revokeObjectURL(S.f.newPhoto.url);
    S.f.newPhoto = {blob:f, url:URL.createObjectURL(f), video:true, type:f.type || "video/mp4", mb};
    return render();
  }
  S.f.loadingPhoto = true; render();
  compressImage(f)
    .then(r => { if (S.f.newPhoto) URL.revokeObjectURL(S.f.newPhoto.url); S.f.newPhoto = {blob:r.blob, url:URL.createObjectURL(r.blob)}; })
    .catch(err => toast("Não consegui abrir a foto: " + err.message))
    .finally(() => { PHOTO_IN.value = ""; S.f.loadingPhoto = false; S.view = "mural"; render(); });
}
PHOTO_IN.addEventListener("change", onPhotoPicked);
PHOTO_IN.addEventListener("cancel", () => { S.picking = false; });
document.addEventListener("dblclick", e => { const im = e.target.closest("[data-dbl]"); if (im) toggleLike(im.dataset.dbl, true); });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; const d = el.dataset;
  const t = S.data && turmaAtual();
  if (a !== "ask") S.confirm = null;
  switch (a) {
    case "retry": refresh(); break;
    case "view": S.view = d.v; window.scrollTo(0,0); render(); break;
    case "panela": S.panela = true; S.view = "turma"; window.scrollTo(0,0); render(); break;
    case "dayToggle": dayToggle(d.t, d.n); break;
    case "addPanela": addPanela(); break;
    case "delPanela": delPanela(d.n); break;
    case "turma": S.panela = false; S.turma = d.id; store.set("panelinha-turma", d.id); S.champ = null; S.day = "mes"; render(); break;
    case "who": S.sheet = "who"; render(); break;
    case "closeWho": S.sheet = null; render(); break;
    case "setMe": S.me = d.n; store.set("panelinha-me", d.n); S.sheet = null; render(); break;
    case "setMeOutro": { const n = S.f.meOutro.trim(); if (!n) return; S.me = n; store.set("panelinha-me", n); S.sheet = null; S.f.meOutro = ""; render(); break; }
    case "goRank": S.view = "rank"; S.champ = d.id; S.ctab = "ranking"; S.day = "mes"; window.scrollTo(0,0); render(); break;
    case "goLaunch": S.view = "jogo"; window.scrollTo(0,0); render(); break;
    case "ctab": S.ctab = d.v; render(); break;
    case "day": S.day = d.v; render(); break;
    case "reload": refresh().then(() => toast("Consulta atualizada")); break;
    case "ask": S.confirm = d.id; render(); break;
    case "pres": setPresence(t, nextDate(t), d.n, d.s); break;
    case "delPres": act(() => DB.remove("presencas", d.id)); break;
    case "callSub": { const date = nextDate(t); const cur = presOf(t, date).find(p => p.nome === d.n); act(() => cur ? DB.remove("presencas", cur.id) : DB.insert("presencas", {turma_id:t.id, data:date, nome:d.n, status:"vou", tipo:"substituto"})); break; }
    case "addGuest": { const n = S.f.guest.trim(); if (!n) return toast("Escreva o nome do convidado."); S.f.guest = ""; act(() => DB.insert("presencas", {turma_id:t.id, data:nextDate(t), nome:n, status:"vou", tipo:"convidado"}), n+" entrou no jogo"); break; }
    case "score": S.f[d.k] = Number(d.v); render(); break;
    case "saveGame": saveGame(); break;
    case "delGame": act(() => DB.remove("partidas", d.id), "Jogo excluído"); break;
    case "compose": S.f.compose = true; render(); break;
    case "newDay": S.view = "turma"; S.panela = false; render(); { const el = document.getElementById("novoDia"); if (el) { el.scrollIntoView({behavior:"smooth", block:"start"}); const i = el.querySelector("input"); if (i) setTimeout(() => i.focus(), 400); } } break;
    case "pickPhoto": S.picking = true; S.f.compose = true; PHOTO_IN.value = ""; PHOTO_IN.click(); break;
    case "composeCancel": if (S.f.newPhoto) URL.revokeObjectURL(S.f.newPhoto.url); S.f.newPhoto = null; S.f.compose = false; S.f.post = ""; render(); break;
    case "post": publish(); break;
    case "delPost": { const p = S.data.mural.find(x => x.id === d.id); act(async () => { await DB.remove("mural", d.id); if (p && p.foto) await removePhoto(p.foto); }, "Publicação apagada"); break; }
    case "like": toggleLike(d.id); break;
    case "openC": S.f.openC = S.f.openC === d.id ? null : d.id; render(); { const inp = document.querySelector(`[data-bind="cmt.${d.id}"]`); if (inp && S.f.openC) inp.focus(); } break;
    case "sendC": { const tx = ((S.f.cmt||{})[d.id]||"").trim(); if (!tx) return; if (!S.me) { S.sheet = "who"; return render(); } S.f.cmt[d.id] = ""; act(() => DB.insert("comentarios", {post_id:d.id, autor:S.me, texto:tx})); break; }
    case "delC": act(() => DB.remove("comentarios", d.id)); break;
    case "addMember": addMember(); break;
    case "delMember": act(() => DB.update("turmas", t.id, {membros: t.membros.filter(n => n !== d.n)}), d.n+" saiu da turma"); break;
    case "saveTurma": { const hi = document.getElementById("ti").value, hf = document.getElementById("tf").value, v = Math.max(2, Number(document.getElementById("tv").value)||t.vagas), l = document.getElementById("tl").value; act(() => DB.update("turmas", t.id, {hora_inicio:hi, hora_fim:hf, vagas:v, local:l}), "Turma atualizada"); break; }
    case "rosterAdd": { const c = S.data.campeonatos.find(x => x.id === d.c); act(() => DB.update("campeonatos", c.id, {jogadores:[...(c.jogadores||[]), d.n]}), d.n+" entrou no ranking"); break; }
    case "rosterDel": { const c = S.data.campeonatos.find(x => x.id === d.c); act(() => DB.update("campeonatos", c.id, {jogadores:(c.jogadores||[]).filter(n => n !== d.n)}), d.n+" saiu do ranking"); break; }
    case "toggleEnc": { const c = S.data.campeonatos.find(x => x.id === d.c); act(() => DB.update("campeonatos", c.id, {encerrado:!c.encerrado})); break; }
    case "drawToggle": { const p = S.f.drawPick || []; S.f.drawPick = p.includes(d.n) ? p.filter(x => x !== d.n) : p.concat(d.n); render(); break; }
    case "drawGo": doDraw(drawTurma()); break;
    case "redrawGo": S.f.redraw = true; S.f.drawPick = null; render(); break;
    case "redrawCancel": S.f.redraw = false; render(); break;
    case "dOpen": S.f.scoreOpen = Number(d.i); S.f.spa = null; S.f.spb = null; render(); break;
    case "dClose": S.f.scoreOpen = null; render(); break;
    case "dSave": saveDrawGame(Number(d.i)); break;
    case "manual": S.f.manual = !S.f.manual; render(); break;
    case "drawLaunch": { const date = nextDate(t); const sor = sorteioOf(t, date); const j = sor && sor.jogos[Number(d.i)]; const c = currentChamp(t.id); if (!j || !c) return;
      Object.assign(S.f, {a1:j.a[0], a2:j.a[1], b1:j.b[0], b2:j.b[1], pa:null, pb:null, data:date, fromDraw:true}); S.view = "jogo"; S.f.manual = true; window.scrollTo(0,0); render(); break; }
    case "newChamp": newChamp(); break;
    case "newTurma": newTurma(); break;
  }
});
async function ensurePlayer(n){ if (!S.data.jogadores.find(j => j.nome.toLowerCase() === n.toLowerCase())) await DB.insert("jogadores", {nome:n, ativo:true}); }
function addMember(){
  const t = turmaAtual(); const n = S.f.newMember.trim(); if (!n) return toast("Escreva o nome.");
  if (t.membros.includes(n)) return toast(n+" já está na turma.");
  const c = currentChamp(t.id); const addRank = S.f.addRank;
  S.f.newMember = "";
  act(async () => { await ensurePlayer(n); await DB.update("turmas", t.id, {membros:[...t.membros, n]}); if (addRank && c && !c.encerrado && !(c.jogadores||[]).includes(n)) await DB.update("campeonatos", c.id, {jogadores:[...(c.jogadores||[]), n]}); }, n+" entrou na turma");
}
function saveGame(){
  const c = S.data.campeonatos.find(x => x.id === S.champ); if (!c) return;
  const nm = k => S.f[k] === "__outro" ? (S.f.outro[k]||"").trim() : S.f[k];
  const P = ["a1","a2","b1","b2"].map(nm);
  if (P.some(x => !x)) return toast("Escolha os quatro jogadores.");
  if (new Set(P).size < 4) return toast("Tem jogador repetido.");
  if (S.f.pa == null || S.f.pb == null) return toast("Marque o placar das duas duplas.");
  if (S.f.pa === S.f.pb) return toast("Placar empatado não vale.");
  const numero = gamesOf(c.id).reduce((m,g) => Math.max(m, g.numero||0), 0) + 1;
  const row = {campeonato_id:c.id, numero, data:S.f.data || today(), a1:P[0], a2:P[1], b1:P[2], b2:P[3], placar_a:S.f.pa, placar_b:S.f.pb};
  S.f.pa = null; S.f.pb = null;
  const back = S.f.fromDraw;
  if (back) { S.f.a1 = S.f.a2 = S.f.b1 = S.f.b2 = ""; S.f.fromDraw = false; }
  act(async () => { await DB.insert("partidas", row); S.view = "jogo"; }, "Placar salvo. Ranking atualizado.");
}
function drawTurma(){
  // na aba Campeonato, a turma é a do campeonato aberto; nas outras, a turma selecionada
  if (S.view === "rank") { const c = S.data.campeonatos.find(x => x.id === S.champ); const tc = c && S.data.turmas.find(x => x.id === c.turma_id); if (tc) return tc; }
  return turmaAtual();
}
function saveDrawGame(i){
  const t = drawTurma(); const date = nextDate(t); const sor = sorteioOf(t, date); const c = currentChamp(t.id);
  const j = sor && sor.jogos[i]; if (!j || !c) return;
  if (S.f.spa == null || S.f.spb == null) return toast("Marque o placar das duas duplas.");
  if (S.f.spa === S.f.spb) return toast("Placar empatado não vale.");
  const numero = gamesOf(c.id).reduce((m,g) => Math.max(m, g.numero||0), 0) + 1;
  const row = {campeonato_id:c.id, numero, data:date, a1:j.a[0], a2:j.a[1], b1:j.b[0], b2:j.b[1], placar_a:S.f.spa, placar_b:S.f.spb};
  S.f.scoreOpen = null; S.f.spa = null; S.f.spb = null;
  act(() => DB.insert("partidas", row), "Jogo "+(i+1)+" lançado. Ranking atualizado.");
}
async function publish(){
  if (!S.me) { S.sheet = "who"; return render(); }
  const tx = S.f.post.trim(); const np = S.f.newPhoto;
  if (!tx && !np) return toast("Escolha uma foto, um vídeo ou escreva algo.");
  S.f.posting = true; render();
  try {
    const row = {autor:S.me, texto:tx};
    if (np) row.foto = await uploadPhoto(np.blob, np.video ? np.type : "image/jpeg");
    await DB.insert("mural", row);
    if (np) URL.revokeObjectURL(np.url);
    S.f.newPhoto = null; S.f.compose = false; S.f.post = "";
    await refresh(); toast("Publicado");
  } catch(e){ console.error(e); toast("Não deu certo: " + (e.message || "erro")); }
  S.f.posting = false; render();
}
function toggleLike(id, onlyAdd){
  if (S.noSocial) return; if (!S.me) { S.sheet = "who"; return render(); }
  const p = S.data.mural.find(x => x.id === id); if (!p) return;
  const cur = Array.isArray(p.curtidas) ? p.curtidas : [];
  if (onlyAdd && cur.includes(S.me)) return;
  const next = cur.includes(S.me) ? cur.filter(n => n !== S.me) : cur.concat(S.me);
  p.curtidas = next; render();
  act(() => DB.update("mural", id, {curtidas: next}));
}
function doDraw(t){
  const date = nextDate(t); const pick = (S.f.drawPick||[]).slice();
  if (pick.length < 4) return toast("Marque pelo menos 4 jogadores.");
  const rounds = Math.max(1, Number(S.f.drawRounds) || defaultRounds(pick.length, t) || 1);
  const jogos = sortear(pick, rounds);
  act(async () => { const shared = await saveSorteio(t, date, jogos); S.f.redraw = false; if (!shared) setTimeout(() => toast("Sorteio salvo só neste celular."), 50); }, jogos.length+" jogos sorteados");
}
function newChamp(){
  const t = turmaAtual(); const nome = S.f.champNome.trim(); if (!nome) return toast("Dê um nome ao campeonato.");
  const row = {id:uid("c"), nome, turma_id:t.id, inicio:S.f.champIni || today(), fim:S.f.champFim || null, encerrado:false, jogadores:t.membros.slice()};
  S.f.champNome = ""; S.f.champIni = ""; S.f.champFim = "";
  act(() => DB.insert("campeonatos", row).then(() => { S.champ = row.id; }), "Campeonato criado");
}
function newTurma(){
  const nome = S.f.tNome.trim(); if (!nome) return toast("Dê um nome à turma.");
  const id = nome.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || uid("t");
  if (S.data.turmas.find(x => x.id === id)) return toast("Já existe uma turma com esse nome.");
  const row = {id, nome, dia_semana:Number(S.f.tDia), hora_inicio:S.f.tIni, hora_fim:S.f.tFim, vagas:Math.max(2, Number(S.f.tVagas)||4), local:"Guto Beach Tenis", membros: S.me? [S.me]:[]};
  S.f.tNome = "";
  act(async () => { await DB.insert("turmas", row); S.turma = id; store.set("panelinha-turma", id); }, "Turma criada");
}

/* ---------- início ---------- */
refresh();
const busy = () => S.picking || S.f.compose || S.f.loadingPhoto || S.f.posting;
if (ONLINE) { setInterval(() => { if (document.visibilityState === "visible" && !document.activeElement.dataset.bind && !busy()) refresh(); }, 30000); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !busy()) refresh(); }); }
</script>
</body>
</html>
